[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civet-audit"
version = "0.1.0"
description = "Zero-dependency security auditor for GitHub Actions workflows — 36 rules, evidence-first, SARIF for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
# Core stays dependency-free on purpose: the scanner must run on a bare
# interpreter with no network, which is exactly where CI needs it.
dependencies = []
keywords = [
  "github-actions",
  "security",
  "cicd",
  "supply-chain",
  "static-analysis",
  "sarif",
  "devsecops",
  "linter",
  "workflow",
  "pwn-request",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer and moved it; this server targets 1.x.
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/xuange-hu/civet"
Repository = "https://github.com/xuange-hu/civet"
Issues = "https://github.com/xuange-hu/civet/issues"

[project.scripts]
civet = "civet.cli:main"
civet-mcp = "civet.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
