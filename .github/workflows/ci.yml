name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -c "import civet, sys; print('imported with deps:', [m for m in sys.modules if m in ('yaml','click','rich','requests')])"
          python -c "
          import subprocess, sys
          mods = subprocess.run([sys.executable, '-c', 'import civet.cli'], capture_output=True)
          assert mods.returncode == 0, mods.stderr.decode()
          print('cli imports cleanly with no third-party packages installed')
          "

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          civet --version
          civet rules | head -5
          civet demo | tail -3
          civet scan . --fail-on none

      - name: MCP manifest check
        run: |
          python -m pip install ".[mcp]"
          python -c "
          from civet.mcp_server import build_server
          import asyncio
          s = build_server()
          async def go():
              tools = await s.list_tools()
              assert len(tools) == 4, [t.name for t in tools]
              print('mcp tools:', [t.name for t in tools])
          asyncio.run(go())
          "

  badge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: README test-count badge vs pytest collection
        run: |
          python -m pip install pytest
          actual=$(python -m pytest --collect-only -q 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+")
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1)
          echo "collected=$actual claimed=$claimed"
          if [ "$actual" != "$claimed" ]; then
            echo "::warning::README badge says $claimed but pytest collects $actual"
          fi

  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: civet audits its own workflows
        run: |
          python -m pip install .
          civet scan . --fail-on none --format sarif -o civet.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: civet.sarif
          category: civet
