name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # pytest is a dev tool, not a dependency: the zero-dependency promise is
          # about what `pip install civet-audit` drags in, and the check below
          # proves that. Not installing it made `python -m pytest` exit 1 on every
          # matrix leg and turned the badge red for a week.
          python -m pip install pytest
          python -c "import civet, sys; print('imported with deps:', [m for m in sys.modules if m in ('yaml','click','rich','requests')])"
          python -c "
          import subprocess, sys
          mods = subprocess.run([sys.executable, '-c', 'import civet.cli'], capture_output=True)
          assert mods.returncode == 0, mods.stderr.decode()
          print('cli imports cleanly with no third-party packages installed')
          "

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          civet --version
          civet rules | head -5
          civet demo | tail -3
          civet scan . --fail-on none

      - name: MCP manifest check
        run: |
          python -m pip install ".[mcp]"
          python -c "
          from civet.mcp_server import build_server
          import asyncio
          s = build_server()
          async def go():
              tools = await s.list_tools()
              assert len(tools) == 4, [t.name for t in tools]
              print('mcp tools:', [t.name for t in tools])
          asyncio.run(go())
          "

  badge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      # Everything the test suite can exercise must be installed here, otherwise
      # self-skipping modules make the real count environment-dependent.
      - name: Install with optional test deps
        run: |
          python -m pip install -e ".[mcp]" pytest pyyaml
      - name: README test-count badge vs pytest collection
        run: |
          # -o addopts= neutralises a project-level addopts="-q": with the -q below
          # it becomes -qq and pytest -qq drops the "N tests collected" line.
          actual=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" || true)
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1 || true)
          echo "collected=${actual:-NOTHING} claimed=${claimed:-NONE}"
          if [ -z "$actual" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$actual" != "$claimed" ]; then
            echo "::warning::README badge says $claimed but pytest collects $actual"
          fi

  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # codeql-action/upload-sarif needs security-events: write; with only
    # `contents: read` from the top of the file the upload answered
    # "Resource not accessible by integration" and the job went red.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: civet audits its own workflows
        run: |
          python -m pip install .
          civet scan . --fail-on none --format sarif -o civet.sarif
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3
        with:
          sarif_file: civet.sarif
          category: civet
